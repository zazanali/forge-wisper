<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge Wisper</title>
    <link rel="icon" type="image/svg+xml" href="/forge-wisper-logo.svg" />

    <!-- Instant Zero-Delay Clean Paint on startup with System Theme support -->
    <style>
      html, body, #root {
        background-color: #F7F9F8;
        color: #17201F;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      [data-theme="dark"] html,
      [data-theme="dark"] body,
      [data-theme="dark"] #root {
        background-color: #0C1112 !important;
        color: #EEF2F1 !important;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) html,
        :root:not([data-theme="light"]) body,
        :root:not([data-theme="light"]) #root,
        [data-theme="system"] html,
        [data-theme="system"] body,
        [data-theme="system"] #root {
          background-color: #0C1112 !important;
          color: #EEF2F1 !important;
        }
      }
      html.recorder-window,
      body.recorder-window,
      body.recorder-window #root,
      [data-theme="dark"] html.recorder-window,
      [data-theme="dark"] body.recorder-window,
      [data-theme="dark"] body.recorder-window #root {
        background-color: transparent !important;
        background: transparent !important;
      }
    </style>

    <!-- Google Fonts: Geist Sans, Geist Mono, and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body class="bg-[var(--bg-app)] text-[var(--text-primary)] font-sans antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
