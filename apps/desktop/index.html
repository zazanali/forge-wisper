<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge Wisper</title>
    <link rel="icon" type="image/svg+xml" href="/forge-wisper-logo.svg" />

    <!-- Instant Zero-Delay Clean Paint on startup with System & Saved Theme support -->
    <script>
      (function() {
        try {
          if (window.location.hash.includes('recorder') || window.location.search.includes('recorder')) {
            document.documentElement.classList.add('recorder-window');
            return;
          }
          var savedTheme = localStorage.getItem('forge_theme') || localStorage.getItem('forge_theme_pref') || 'dark';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effectiveTheme = savedTheme === 'system' ? (prefersDark ? 'dark' : 'light') : savedTheme;
          document.documentElement.setAttribute('data-theme', effectiveTheme);
          if (effectiveTheme === 'light') {
            document.documentElement.style.backgroundColor = '#F7F9F8';
            document.documentElement.style.color = '#17201F';
          } else {
            document.documentElement.style.backgroundColor = '#0C1112';
            document.documentElement.style.color = '#EEF2F1';
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body, #root {
        background-color: #0C1112;
        color: #EEF2F1;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background-color: #F7F9F8 !important;
        color: #17201F !important;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background-color: #0C1112 !important;
        color: #EEF2F1 !important;
      }
      html.recorder-window,
      body.recorder-window,
      body.recorder-window #root,
      html[data-theme="dark"].recorder-window,
      html[data-theme="dark"] body.recorder-window,
      html[data-theme="dark"] body.recorder-window #root,
      html[data-theme="light"].recorder-window,
      html[data-theme="light"] body.recorder-window,
      html[data-theme="light"] body.recorder-window #root {
        background-color: transparent !important;
        background: transparent !important;
      }
    </style>

    <!-- Google Fonts: Geist Sans, Geist Mono, and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body class="bg-[var(--bg-app)] text-[var(--text-primary)] font-sans antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
