[package]
name = "forge-desktop-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-process = "2.0"

forge-audio = { path = "../../../crates/audio" }
forge-transcription = { path = "../../../crates/transcription" }
forge-cleanup = { path = "../../../crates/cleanup" }
forge-verification = { path = "../../../crates/verification" }
forge-output = { path = "../../../crates/output" }
forge-storage = { path = "../../../crates/storage" }
forge-security = { path = "../../../crates/security" }

forge-provider-mock = { path = "../../../providers/mock" }
forge-provider-groq = { path = "../../../providers/groq" }
forge-provider-local-whisper = { path = "../../../providers/local-whisper" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
