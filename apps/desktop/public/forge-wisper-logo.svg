<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" />
      <stop offset="60%" stop-color="#0D0F16" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5E" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3FE3C4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E222D" stop-opacity="0.4" />
    </linearGradient>

    <!-- Bar 1 (Teal Resonance) -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1EA88D" />
      <stop offset="50%" stop-color="#3FE3C4" />
      <stop offset="100%" stop-color="#7BFFDF" />
    </linearGradient>

    <!-- Bar 2 (Sonic Fusion: Teal to Blade) -->
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3FE3C4" />
      <stop offset="40%" stop-color="#4E9FFF" />
      <stop offset="70%" stop-color="#FF4D5E" />
      <stop offset="100%" stop-color="#FF7A88" />
    </linearGradient>

    <!-- Bar 3 (Main Forge Blade Peak) -->
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B31224" />
      <stop offset="40%" stop-color="#FF4D5E" />
      <stop offset="85%" stop-color="#FF6E7B" />
      <stop offset="100%" stop-color="#FFA8AF" />
    </linearGradient>

    <!-- Bar 4 (Whisper Arc) -->
    <linearGradient id="bar4Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D92036" />
      <stop offset="60%" stop-color="#FF4D5E" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>

    <!-- Bar 5 (Spark Satellite) -->
    <linearGradient id="bar5Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4D5E" />
      <stop offset="100%" stop-color="#3FE3C4" />
    </linearGradient>

    <!-- Ambient Core Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF4D5E" flood-opacity="0.25" />
    </filter>

    <!-- Glass Specular Reflection -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FF4D5E" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3FE3C4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <g filter="url(#shadowFilter)">
    <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  </g>

  <!-- Center Ambient Radial Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerAura)" pointer-events="none" />

  <!-- Modern Geometric Sonic Waveform Bars (Whisper Soundwave + Forge Flame Shape) -->
  <g filter="url(#coreGlow)">
    <!-- Bar 1 (Teal Acoustic Resonance) -->
    <rect x="124" y="206" width="36" height="100" rx="18" fill="url(#bar1Grad)" />

    <!-- Bar 2 (Sonic Ascension - Teal to Blade) -->
    <rect x="178" y="146" width="36" height="220" rx="18" fill="url(#bar2Grad)" />

    <!-- Bar 3 (Primary Forge Peak - Blade Red Apex) -->
    <rect x="232" y="86" width="48" height="340" rx="24" fill="url(#bar3Grad)" />

    <!-- Bar 4 (Harmonic Whisper Arc) -->
    <rect x="298" y="146" width="36" height="220" rx="18" fill="url(#bar4Grad)" />

    <!-- Bar 5 (Electric Ember Satellite) -->
    <rect x="352" y="206" width="36" height="100" rx="18" fill="url(#bar5Grad)" />
  </g>

  <!-- Soundwave Dynamic Linking Arc (The "Forge" Energy Nexus) -->
  <path
    d="M 124 256 C 178 300 232 300 256 256 C 280 212 334 212 388 256"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.4"
    filter="url(#softGlow)"
  />

  <!-- High-Energy Luminescence Sparks -->
  <circle cx="256" cy="110" r="5" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="200" cy="170" r="3.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="314" cy="170" r="3.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Diagonal Glass Glare Sweep -->
  <path
    d="M 32 32 C 120 32 440 90 480 340 L 480 140 C 480 80 432 32 372 32 Z"
    fill="url(#glassGlare)"
    pointer-events="none"
  />
</svg>
