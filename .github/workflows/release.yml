name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg,app'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @forge-wisper/desktop build

      - name: Build Tauri Application & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Forge Wisper ${{ github.ref_name }}'
          releaseBody: |
            ## Forge Wisper Desktop Setup (${{ github.ref_name }})
            
            Download the official cross-platform installer below:
            - 🪟 **Windows**: `Forge.Wisper_0.1.2_x64-setup.exe`
            - 🍎 **macOS**: `Forge.Wisper_0.1.2_aarch64.dmg` (Apple Silicon M1/M2/M3/M4 & Intel)
            
            ### ✨ What's New in This Release
            - ⚡ **Real-Time Cursor Dictation**: Streams and types transcribed speech directly into your active cursor without lag or intrusive text blocking.
            - 🌐 **99+ Language Support & Quick Switcher**: 1-click header toolbar dropdown with dedicated English Attention Head Locking to eliminate language confusion.
            - 📝 **100% Dynamic Voice Snippets**: Voice macros and prompt shortcuts automatically expand onto fresh lines without hardcoding.
            - 🎨 **Redesigned Modern Dashboard**: Balanced 50/50 hero cards with a responsive real-time audio waveform equalizer.
            - 📊 **Dynamic Accomplishment Metrics**: Live SQLite-driven analytics for Total Words Transcribed, Time Saved, Sessions, and Typing WPM with **Today**, **This Week**, and **All Time** filters.
            - 🚀 **Zero-Config Windows Auto-Startup**: Automatically registers with Windows Registry on boot with instant, zero-hang background initialization.
            - 🎙️ **Hardware Audio VU Meter & Anti-Aliased Resampling**: Band-limited decimation filter (48kHz/96kHz $\to$ 16kHz) for crystal-clear transcription accuracy.
            - ⚡ **Dual AI Engines**: Ultra-low latency Groq Cloud & 100% offline private Local Whisper with dynamic model switching.
            - ⌨️ **Interactive Shortcut Keycaps**: Dynamic hotkey indicator displaying your exact configured global shortcut.
            - 🌓 **High-Contrast Theme Polish**: Crisp readability in both Dark and Light modes.
            
            *Created by Ali Zazan • Built for creators and developers.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'
