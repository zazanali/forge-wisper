name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg,app'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @forge-wisper/desktop build

      - name: Build Tauri Application & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Forge Wisper ${{ github.ref_name }}'
          releaseBody: |
            ## Forge Wisper Desktop Setup (${{ github.ref_name }})
            
            Download the official cross-platform installer below:
            - 🪟 **Windows**: `Forge.Wisper_0.1.4_x64-setup.exe` (NSIS Installer)
            - 🍎 **macOS**: `Forge.Wisper_0.1.4_aarch64.dmg` (Apple Silicon M1–M4 & Intel)
            
            ### ✨ What's New in v0.1.4
            - ⚡ **Zero-Latency Settings & Dropdowns**:
              - Eliminated the 8–10 second delay when changing formatting mode, microphone, speech provider (Local Whisper / Groq Cloud), or language.
              - Settings now change instantaneously (0ms visual latency) with optimistic UI updates and non-blocking asynchronous persistence.
            - 🎙️ **Live Microphone Hotplug Detection**:
              - Opening the microphone selector now dynamically re-probes audio devices so newly plugged-in USB/Bluetooth headsets appear immediately without requiring an app restart.
            - 🎨 **Refined Dictation Header**:
              - Streamlined the dictation card header by removing redundant duplicate format buttons, keeping the UI minimal, modern, and focused.
            - 🌐 **Official AI NetworkX Community Branding**:
              - Embedded the official AI NetworkX logo directly into the Community card in Settings with a clean, distraction-free footer.
            - 🔄 **Dynamic Version & Update Status**:
              - Integrated interactive spinning update arrows (`RefreshCw`) and automatic transition to upgrade indicator (`ArrowUpCircle`) when a new version is detected.
            - 🛡️ **Enhanced Windows Defender Compatibility**:
              - Registry autostart writes and Win32 global hotkey registrations are now smart-diffed and dispatched off the main thread to prevent external antivirus scan pauses.
            
            *Created by Ali Zazan • Built for creators and developers.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'
