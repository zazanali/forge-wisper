name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @forge-wisper/desktop build

      - name: Build Tauri Application & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Forge Wisper ${{ github.ref_name }}'
          releaseBody: |
            ## Forge Wisper Desktop Setup (${{ github.ref_name }})
            
            Download and run the official Windows installer below to install **Forge Wisper**.
            
            ### Highlights
            - 🎙️ **Frictionless Global Dictation**: Press `Ctrl + Space` anywhere to speak.
            - ⚡ **Dual AI Engines**: Ultra-fast Groq Cloud & 100% Offline Local Whisper.
            - 🧠 **Smart Speech Cleanup**: Automatic filler removal, self-corrections & verbal punctuation.
            - 🛡️ **Privacy First**: In-memory audio processing with zero disk persistence.
            
            *Created by Ali Zazan • Built for creators and developers.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'
