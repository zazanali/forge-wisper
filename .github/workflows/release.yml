name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg,app'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @forge-wisper/desktop build

      - name: Build Tauri Application & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Forge Wisper ${{ github.ref_name }}'
          releaseBody: |
            ## Forge Wisper Desktop Setup (${{ github.ref_name }})
            
            Download the official cross-platform installer below:
            - 🪟 **Windows**: `Forge.Wisper_0.1.3_x64-setup.exe` (NSIS Installer)
            - 🍎 **macOS**: `Forge.Wisper_0.1.3_aarch64.dmg` (Apple Silicon M1–M4 & Intel)
            
            ### ✨ What's New in This Release
            - 🔄 **Antigravity-Style In-App Online Updater**:
              - Automatically checks GitHub Releases in the background with zero startup lag.
              - Unobtrusive floating top-banner notification when a new version is detected.
              - Interactive "What's New" release notes modal with changelog preview, published date, and installer size.
              - Real-time download streaming with live byte counters and progress percentage (`forge://update-download-progress`).
              - 1-click seamless detached installer relaunch (`CREATE_BREAKAWAY_FROM_JOB | DETACHED_PROCESS` on Windows, native `.dmg` on macOS).
              - Manual "Check for Updates" button with live status badges in Settings ("Up to Date" / "Update Available").
            - 🌐 **45+ Multi-Language Engine with Live Search & Auto-Detect**:
              - Full support for 45+ world languages (Urdu, Hindi, Arabic, Spanish, French, German, Chinese, Japanese, Russian, Turkish, etc.) plus intelligent "Auto-Detect".
              - Searchable real-time language dropdown on the Dashboard for instant switching.
              - Script-aware hallucination protection: non-Latin scripts (such as Arabic or Urdu) are preserved when speaking those languages, while accidental foreign scripts during English dictation are cleanly scrubbed.
              - Reprocess audio from history with on-the-fly target language selection.
            - ⚡ **Ultra-Fast In-Memory Secret Caching (<10ms Settings Load)**:
              - Eliminated 5-6 second UI freezes when opening Settings or switching tabs by caching encrypted credentials in memory after initial vault unlock, with instant save confirmation.
            - 📊 **Dynamic Accomplishment Metrics & Accurate Audio Duration**:
              - Speech duration is computed directly from raw recorded PCM samples, providing accurate WPM and time-saved metrics across **Today**, **This Week**, and **All Time**.
            - 📱 **Fluid Device-Adaptive Responsive Layout**:
              - Responsive breakpoints supporting mobile, tablet, laptop, and multi-monitor desktop setups.
              - Collapsible slide-over drawer navigation on compact displays with touch-friendly controls and backdrop blur.
            - 💬 **Official AI NetworkX Community Hub**:
              - Direct integration with [community.ainetworkx.com](https://community.ainetworkx.com) for sharing voice snippets, requesting features, and getting community support.
            
            *Created by Ali Zazan • Built for creators and developers.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'
