name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg,app'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @forge-wisper/desktop build

      - name: Build Tauri Application & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Forge Wisper ${{ github.ref_name }}'
          releaseBody: |
            ## Forge Wisper Desktop Setup (${{ github.ref_name }})
            
            Download the official cross-platform installer below:
            - 🪟 **Windows**: `Forge.Wisper_${{ github.ref_name }}_x64-setup.exe` (NSIS Installer)
            - 🍎 **macOS**: `Forge.Wisper_${{ github.ref_name }}_aarch64.dmg` (Apple Silicon M1–M4 & Intel)
            
            ### ✨ What's New in ${{ github.ref_name }}
            - ⚡ **NVIDIA FastConformer Parakeet ONNX Engine**:
              - Sub-second on-device speech recognition powered by INT8 ONNX models with automated Hugging Face streaming downloader.
            - 🔍 **Smart Hardware Detection & Compute Routing**:
              - Dynamic hardware scanner for Vulkan GPU compute acceleration ($\ge 512\text{ MB}$ dedicated VRAM) with seamless multi-threaded AVX2 CPU fallback.
            - 🔒 **Native Single-Instance Protection**:
              - Enforced Win32 Named Mutex single-instance locking to prevent duplicate background instances, ghost tray icons, and shortcut conflicts.
            - 🛡️ **Zero Console Flashing**:
              - Strictly enforced Win32 GUI subsystem (`windows_subsystem = "windows"`) and `CREATE_NO_WINDOW` on all background child processes.
            - 📱 **Responsive Bento Layout Redesign**:
              - Multi-breakpoint responsive layout with collapsible navigation, real-time WPM analytics, and live LED VU level meters.
            - 🛡️ **Hardened Security & URL Validation**:
              - Strict URL scheme validation (`https://`, `http://`, `mailto:`) and shell metacharacter rejection on IPC command execution.
            
            *Created by Ali Zazan • Built for creators and developers.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'
