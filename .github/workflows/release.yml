name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Application & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Forge Wisper v__VERSION__'
          releaseBody: |
            See the assets to download this version and install.
            ### Highlights
            - Real-time cloud & offline speech dictation
            - Automated speech cleanup & punctuation formatting
            - Full NSIS (.exe) and MSI (.msi) Windows installers
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'
